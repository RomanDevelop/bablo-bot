name: crypto_trading_bot
description: Bablo Trading Service — client cabinet for MACD trading bot.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  provider: ^6.1.5
  rxdart: ^0.28.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  webview_flutter_web: ^0.2.3+4
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.7+1
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/partner/monobank_jar_qr.png
    - assets/branding/bablo_community_hero.png
    - assets/branding/app_icon.png
    - assets/branding/alexander_l_hero.png
    - assets/branding/anton_the_fed_hero.png
    - assets/branding/iren_the_oracle_hero.png
